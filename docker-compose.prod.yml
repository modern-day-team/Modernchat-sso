# SSO 生产一键环境（MySQL + 后端容器）
#
#   cd web && npm ci && npm run build        # 先构建门户静态产物（nginx 容器挂载用）
#   export JWT_SECRET=$(openssl rand -hex 32)
#   export MYSQL_ROOT_PASSWORD=$(openssl rand -base64 24)
#   export COOKIE_SECURE=true
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 说明：
# - 与根目录 docker-compose.yml（本地开发，仅 MySQL）分离，凭据必须显式注入，
#   未设置时 compose 直接报错，不会以弱凭据启动（与主仓库口径一致）。
# - 建表走服务启动期 AutoMigrate（与本地一致）；需要版本化迁移时改用
#   scripts/install.sh + server/migrations/（MYSQL_* 环境变量）。
# - 跨子域共享 mc_auth cookie：加 export COOKIE_DOMAIN=.example.com
#   （必须与 COOKIE_SECURE=true 同用，config.Load 会拒绝非法组合）。
# - 镜像源可配置：GO_IMAGE / RUNTIME_IMAGE / GOPROXY / APK_MIRROR 透传给 Dockerfile。
# - 门户静态托管见文末注释（需先构建 web/dist）。

services:
  mysql:
    image: mysql:8.0
    container_name: modernchat-sso-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set (use: openssl rand -base64 24)}"
      MYSQL_DATABASE: modernchat_sso
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 仅绑定宿主机回环地址，避免 MySQL 端口暴露到所有网络接口
      - "127.0.0.1:3307:3306"
    volumes:
      - sso-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      args:
        VERSION: "${VERSION:-dev}"
        COMMIT: "${COMMIT:-unknown}"
        BUILD_TIME: "${BUILD_TIME:-unknown}"
        GO_IMAGE: "${GO_IMAGE:-golang:1.26-alpine}"
        RUNTIME_IMAGE: "${RUNTIME_IMAGE:-alpine:3.21}"
        GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}"
        APK_MIRROR: "${APK_MIRROR:-dl-cdn.alpinelinux.org}"
    container_name: modernchat-sso-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: "8090"
      GIN_MODE: release
      DB_DSN: "root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/modernchat_sso?charset=utf8mb4&parseTime=true&loc=Local"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set (use: openssl rand -hex 32)}"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      COOKIE_DOMAIN: "${COOKIE_DOMAIN:-}"
      PUBLIC_URL: "${PUBLIC_URL:?PUBLIC_URL must be set (门户公开地址，重置密码邮件链接前缀)}"
      WEB_UPDATE: "${WEB_UPDATE:-false}"
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  sso-mysql-data:

