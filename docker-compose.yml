# 本地开发环境：MySQL 8（映射到 3307，避免与主仓库默认 3306 冲突）
services:
  mysql:
    image: mysql:8
    ports:
      - "3307:3306"
    environment:
      # 仅限本地开发默认值；生产一律用环境变量注入，严禁提交真实凭据
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-modernchat_sso_dev}
      MYSQL_DATABASE: modernchat_sso
    volumes:
      - sso-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  sso-mysql-data:
